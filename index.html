<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WolframLab Aero</title>
  <meta name="description" content="Aprende Wolfram Mathematica desde cero hasta resolver todas las prácticas y exámenes de 1º y 2º de Ingeniería Aeroespacial.">
  <meta name="theme-color" content="#222222">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23dd1100'/%3E%3Cpath d='M12 7H7v18h5M20 7h5v18h-5' fill='none' stroke='%23fff' stroke-width='2.4'/%3E%3Cpath d='M12 20 20.5 11.5l-2 9-2.8-2.6z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/tokens.css?v=1794353407">
  <link rel="stylesheet" href="css/shell.css?v=1794353407">
  <link rel="stylesheet" href="css/notebook.css?v=1794353407">
  <link rel="stylesheet" href="css/gfx.css?v=1794353407">
  <link rel="stylesheet" href="css/learn.css?v=1794353407">
</head>
<body>
  <a class="skip-link" href="#view">Saltar al contenido</a>

  <div class="app" id="app">
    <!-- barra superior oscura y fina -->
    <header class="top" id="hud">
      <a class="brand" href="#/" aria-label="WolframLab Aero — inicio">
        <svg class="brand-mark" viewBox="0 0 32 32" width="24" height="24" aria-hidden="true">
          <rect width="32" height="32" rx="3" fill="var(--accent)"/>
          <path d="M12 7H7v18h5M20 7h5v18h-5" fill="none" stroke="#fff" stroke-width="2.2"/>
          <path d="M12 20 20.5 11.5l-2 9-2.8-2.6z" fill="#fff"/>
        </svg>
        <span class="brand-text">WolframLab <i>Aero</i></span>
      </a>
      <div class="status" id="status">
        <span class="st-combo" id="hud-combo" hidden aria-live="polite"></span>
        <button class="st-item hud-xp" id="hud-level" type="button" title="Tu nivel y experiencia">
          <span id="hud-level-tx">Nivel 1</span><span class="st-sep opt" aria-hidden="true">·</span><span class="opt" id="hud-xp-txt">0/50 XP</span>
          <span class="st-xpbar" aria-hidden="true"><i id="hud-xp-fill"></i></span>
        </button>
        <button class="st-item" id="hud-streak" type="button" title="Racha de días seguidos estudiando"><span id="hud-streak-tx">Racha 0</span></button>
        <button class="st-item kpill" id="kpill" type="button" data-status="idle" title="Motor de cálculo (Wolfram Language en tu navegador)">
          <span class="kpill-dot" aria-hidden="true"></span><span class="kpill-tx" id="kpill-tx">Motor en reposo</span>
        </button>
        <button class="st-icon" id="hud-sound" type="button" aria-pressed="true" aria-label="Sonido activado" title="Sonido (m)"></button>
        <button class="st-icon" id="hud-settings" type="button" aria-label="Ajustes y progreso" title="Ajustes y progreso"></button>
        <button class="st-icon menu-btn" id="menu-btn" type="button" aria-label="Menú" aria-expanded="false" aria-controls="side"></button>
      </div>
      <div class="kbar" id="kbar" aria-hidden="true"><i id="kpill-fill"></i></div>
    </header>

    <div class="shell">
      <!-- barra lateral gris claro: navegación de texto, activo en rojo -->
      <aside class="side" id="side">
        <nav class="nav" id="nav" aria-label="Navegación principal">
          <div class="nav-group">
            <a class="nav-item" data-nav="home" href="#/">Inicio</a>
          </div>
          <div class="nav-group">
            <a class="nav-item" data-nav="indice" href="#/indice">Índice de contenidos</a>
            <a class="nav-item" data-nav="practica" href="#/practica">Práctica</a>
            <a class="nav-item" data-nav="simulacros" href="#/simulacros">Simulacros de examen</a>
          </div>
          <div class="nav-group">
            <a class="nav-item" data-nav="comandos" href="#/comandos">Comandos</a>
            <a class="nav-item" data-nav="esquema" href="#/esquema">Esquema de comandos</a>
            <a class="nav-item" data-nav="registro" href="#/registro">Registro de prácticas</a>
          </div>
          <div class="nav-group">
            <a class="nav-item" data-nav="cuaderno" href="#/cuaderno">Cuaderno libre</a>
          </div>
          <div class="nav-group nav-extra">
            <button class="nav-item" id="nav-settings" type="button">Ajustes y progreso</button>
          </div>
        </nav>
      </aside>

      <main class="view" id="view" tabindex="-1">
        <div class="page"><div class="skel skel-page" aria-hidden="true"><i style="width:36%;height:30px"></i><i style="width:64%"></i><i style="width:100%;height:90px"></i></div></div>
      </main>
    </div>
  </div>

  <div id="fx-layer" aria-hidden="true"></div>
  <noscript><div class="noscript">WolframLab Aero necesita JavaScript para funcionar (el motor de Mathematica corre en tu navegador).</div></noscript>
  <script type="module" src="js/app.js?v=1794353407"></script>
</body>
</html>
